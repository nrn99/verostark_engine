[package]
name = "verostark_engine"
version = "1.0.0"
edition = "2021"
default-run = "verostark_engine"

[dependencies]
pingora = { git = "https://github.com/cloudflare/pingora", features = ["lb", "proxy", "openssl"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.18"
pingora-limits = { git = "https://github.com/cloudflare/pingora" }
bytes = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json"] }
dotenv = "0.15"
time = { version = "0.3", features = ["serde"] }

candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }


[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

