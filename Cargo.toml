[package]
name = "verostark_engine"
version = "1.0.0"
edition = "2021"

[dependencies]
pingora = { git = "https://github.com/cloudflare/pingora", features = ["lb", "proxy", "openssl"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.18"
pingora-limits = { git = "https://github.com/cloudflare/pingora" }
bytes = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

